services:
  postgres:
    image: postgres:18-alpine
    container_name: didgi-real-payment-postgres
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - didgi-real-payment

  migration:
    image: didgi-real-payment:migrator
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    container_name: didgi-real-payment-migration
    env_file:
      - .env.docker
    command: ["npm", "run", "prisma:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - didgi-real-payment

  app:
    image: didgi-real-payment:app
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: didgi-real-payment-app
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - didgi-real-payment

volumes:
  postgres-data:

networks:
  didgi-real-payment:
    driver: bridge
